<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathe-Übung: Funktionen</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5d667a;--ac:#2f6df6;--ok:#1a9a52;--no:#d83a3a;--bd:#dde1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1b2130;--tx:#e8ebf2;--mu:#9aa3b8;--ac:#6c9bff;--ok:#43c47c;--no:#ff6b6b;--bd:#2c3447;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f;--card:#1b2130;--tx:#e8ebf2;--mu:#9aa3b8;--ac:#6c9bff;--ok:#43c47c;--no:#ff6b6b;--bd:#2c3447;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mu);margin:0 0 14px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:1.1rem;margin:0 0 6px}
.vid{display:inline-block;margin-top:6px;padding:8px 12px;border-radius:10px;background:#e62117;color:#fff;text-decoration:none;font-weight:600}
.q{border-top:1px solid var(--bd);padding:12px 0}
.q:first-of-type{border-top:0}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button,.chk{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:9px 12px;border-radius:10px;font:inherit;text-align:left;cursor:pointer}
.opts button.ok,.q.ok .chk{border-color:var(--ok)}
.opts button.no{border-color:var(--no)}
.opts button.sel{border-color:var(--ac);background:var(--card);font-weight:600}
.res{font-size:1.1rem;font-weight:600;margin-top:10px}
.vt{font-weight:600;margin-top:14px}
.vf{position:relative;padding-top:56.25%;margin:6px 0 2px;border-radius:10px;overflow:hidden;background:#000}
.vf iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vc{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);text-decoration:none}
.vc .pl{flex:none;width:36px;height:36px;border-radius:50%;background:#e62117;color:#fff;display:grid;place-items:center}
.vc .vt{margin:0}
input[type=text]{width:110px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:inline-block;margin-left:6px;background:var(--ac);color:#fff;border-color:var(--ac);text-align:center}
.fb{margin-top:6px;font-size:.95rem;min-height:1.2em}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding:6px 0;color:var(--mu);font-size:.95rem}
svg{width:100%;height:auto;max-width:340px;display:block;margin:6px auto;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.sl{display:flex;align-items:center;gap:8px;margin:4px 0}.sl input{flex:1}
.sl span{width:92px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
<h1>Mathe-Übung: Funktionen</h1>
<p class="sub">Wähle ein Thema, schau das Video und löse die Aufgaben.</p>
<nav id="nav"></nav>
<div class="score" id="score"></div>
<div id="view"></div>
</main>
<script>
var T=[
{id:"fe",n:"Funktionen erkennen",vid:"Lehrer Schmidt Funktionen erkennen und darstellen",v:[["Koordinatensystem - Punkt einzeichnen","or1XaVqYL_4"],["Lineare Funktion - Wertetabelle erstellen","dLfPBJgHgC4"]],
 txt:"Eine Funktion ordnet jedem x-Wert genau einen y-Wert zu. Darstellen kannst du sie als Wertetabelle, Graph oder Funktionsgleichung (z. B. f(x) = 3x − 2).",
 q:[
 {t:"Welche Zuordnung ist eine Funktion?",o:["(1|2), (1|3), (2|4)","(1|2), (2|3), (3|3)","(2|1), (2|5), (2|9)"],a:1,h:"Bei einer Funktion darf jeder x-Wert nur einmal vorkommen. y-Werte dürfen sich wiederholen."},
 {t:"f(x) = 3x − 2. Berechne f(4).",a:10},
 {t:"f(x) = 2x + 1. Welcher y-Wert gehört zu x = −1?",a:-1},
 {t:"Eine Wertetabelle zeigt x: 0, 1, 2, 3 und y: 1, 3, 5, 7. Wie lautet die Gleichung?",o:["y = x + 1","y = 2x + 1","y = 3x + 1"],a:1,h:"Bei x = 0 ist y = 1, und y wächst pro Schritt um 2."},
 {t:"Welcher x-Wert gehört zu y = 7 bei f(x) = 2x + 1?",a:3,h:"7 = 2x + 1, also 2x = 6."},
 {t:"Welche Aussage stimmt? Eine Funktion …",o:["darf einem x zwei y-Werte geben","gibt jedem x genau einen y-Wert","hat immer eine Gerade als Graph"],a:1}]},
{id:"st",n:"Steigung von Geraden",vid:"Lehrer Schmidt Steigung von Geraden Steigungsdreieck",plot:1,v:[["Steigungsdreieck bei einer linearen Funktion","fN52WXY_72g"],["Lineare Funktion - aus zwei Punkten berechnen (und zeichnen)","w4l1uk5qVGE"]],
 txt:"Die Steigung m sagt, wie steil eine Gerade ist: m = Δy ÷ Δx (Höhenunterschied durch Schritt nach rechts). Positiv = steigt, negativ = fällt, 0 = waagerecht.",
 q:[
 {t:"Die Punkte P(1|2) und Q(3|8) liegen auf einer Geraden. Wie groß ist m?",a:3,h:"m = (8 − 2) ÷ (3 − 1) = 6 ÷ 2"},
 {t:"P(0|5) und Q(4|1): Wie groß ist m?",a:-1,h:"m = (1 − 5) ÷ (4 − 0) = −4 ÷ 4"},
 {t:"Steigungsdreieck: 2 Schritte nach rechts, 1 nach oben. Wie groß ist m? (als Dezimalzahl)",a:0.5},
 {t:"Eine waagerechte Gerade hat die Steigung …",o:["0","1","nicht definiert"],a:0,h:"Es gibt keinen Höhenunterschied, also Δy = 0."},
 {t:"P(−2|1) und Q(2|5): Wie groß ist m?",a:1,h:"m = (5 − 1) ÷ (2 − (−2)) = 4 ÷ 4"},
 {t:"Eine Gerade fällt von links oben nach rechts unten. Die Steigung ist …",o:["positiv","negativ","null"],a:1}]},
{id:"pr",n:"Proportionale Funktionen",vid:"Lehrer Schmidt Proportionale Funktionen",plot:2,v:[["Proportionale Zuordnung","MT3hVo_BfT0"]],
 txt:"Proportionale Funktionen haben die Form y = m · x. Der Graph ist eine Gerade durch den Ursprung (0|0). Der Faktor m ist der Proportionalitätsfaktor, also das Verhältnis y ÷ x.",
 q:[
 {t:"Welche Funktion ist proportional?",o:["y = 2x + 1","y = 2x","y = x²"],a:1,h:"Proportional heißt: y = m · x, ohne Zusatz."},
 {t:"3 kg Äpfel kosten 6 €. Was kosten 5 kg?",a:10,h:"1 kg kostet 2 €, also 5 · 2."},
 {t:"Bei einer proportionalen Funktion gehört zu x = 4 der Wert y = 12. Wie groß ist m?",a:3},
 {t:"Der Graph einer proportionalen Funktion geht immer durch …",o:["den Punkt (0|1)","den Ursprung (0|0)","den Punkt (1|0)"],a:1},
 {t:"y = 4x. Berechne y für x = 2,5.",a:10},
 {t:"Tabelle: x = 2 → y = 5 und x = 4 → y = 10. Ist sie proportional?",o:["Ja, m = 2,5","Nein","Ja, m = 2"],a:0,h:"y ÷ x ist immer 5 ÷ 2 = 2,5."}]},
{id:"li",n:"Lineare Funktionen",vid:"Lehrer Schmidt Lineare Funktionen",plot:3,v:[["Lineare Funktion im Koordinatensystem zeichnen","tBhQwSmrAZc"],["Lineare Funktion ablesen","GhhSqXn3cqw"],["Lineare Funktion - Nullstelle berechnen","gbAx4WzT0pI"]],
 txt:"Lineare Funktionen haben die Form y = m · x + b. m ist die Steigung, b der y-Achsenabschnitt (hier schneidet der Graph die y-Achse). Die Nullstelle findest du, indem du y = 0 setzt.",
 q:[
 {t:"Wie groß ist der y-Achsenabschnitt von y = 2x − 3?",a:-3},
 {t:"Eine Gerade geht durch (0|1) und hat m = 2. Wie lautet die Gleichung?",o:["y = x + 2","y = 2x + 1","y = 2x − 1"],a:1},
 {t:"y = −x + 4. Berechne y für x = 3.",a:1},
 {t:"Bestimme die Nullstelle von y = 2x − 6.",a:3,h:"0 = 2x − 6, also 2x = 6."},
 {t:"Welche Gerade ist parallel zu y = 3x + 1?",o:["y = 3x − 5","y = −3x + 1","y = x + 3"],a:0,h:"Parallele Geraden haben die gleiche Steigung."},
 {t:"Eine Gerade geht durch (0|−2) und (1|1). Wie groß ist m?",a:3,h:"m = (1 − (−2)) ÷ (1 − 0)"},
 {t:"Welche Gleichung hat m = −2 und b = 5?",o:["y = 5x − 2","y = −2x + 5","y = 2x − 5"],a:1}]}
];
var done={},cur=0;
function el(h){var d=document.createElement("div");d.innerHTML=h;return d.firstChild}
function score(){var n=0,t=0;T.forEach(function(x){x.q.forEach(function(_,i){t++;if(done[x.id+i])n++})});document.getElementById("score").textContent="Richtig: "+n+" von "+t}
function plot(c,mode){
 var m=mode==3?1:1,b=0;
 var w=el('<div class="card"><h2>Ausprobieren</h2><svg viewBox="-6 -6 12 12"></svg><div class="sl"><span id="lm"></span><input id="sm" type="range" min="-4" max="4" step="0.5" value="1"></div>'+(mode==2?'':'<div class="sl"><span id="lb"></span><input id="sb" type="range" min="-5" max="5" step="1" value="0"></div>')+'</div>');
 c.appendChild(w);
 var svg=w.querySelector("svg"),sm=w.querySelector("#sm"),sb=w.querySelector("#sb");
 function d(){
  m=+sm.value;b=sb?+sb.value:0;
  var s='';for(var i=-5;i<=5;i++)s+='<line x1="'+i+'" y1="-6" x2="'+i+'" y2="6" stroke="currentColor" opacity=".12" stroke-width=".04"/><line x1="-6" y1="'+i+'" x2="6" y2="'+i+'" stroke="currentColor" opacity=".12" stroke-width=".04"/>';
  s+='<line x1="-6" y1="0" x2="6" y2="0" stroke="currentColor" stroke-width=".08"/><line x1="0" y1="-6" x2="0" y2="6" stroke="currentColor" stroke-width=".08"/>';
  var y1=-(m*-6+b),y2=-(m*6+b);
  s+='<line x1="-6" y1="'+y1+'" x2="6" y2="'+y2+'" stroke="#2f6df6" stroke-width=".18"/><circle cx="0" cy="'+(-b)+'" r=".25" fill="#e62117"/>';
  svg.innerHTML=s;
  w.querySelector("#lm").textContent="m = "+m;
  if(sb)w.querySelector("#lb").textContent="b = "+b;
 }
 sm.oninput=d;if(sb)sb.oninput=d;d();
}
function quiz(c,tp){
 tp.q.forEach(function(q,i){
  var k=tp.id+i,box=el('<div class="q"><p></p><div class="fb"></div></div>');
  box.querySelector("p").textContent=(i+1)+". "+q.t;
  var fb=box.querySelector(".fb");
  function res(ok){fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"Richtig!":"Nicht ganz."+(q.h?" Tipp: "+q.h:" Versuch es nochmal.");if(ok){done[k]=1;score()}}
  if(q.o){
   var o=el('<div class="opts"></div>');
   q.o.forEach(function(t,j){var b=document.createElement("button");b.textContent=t;b.onclick=function(){var ok=j==q.a;b.className=ok?"ok":"no";res(ok)};o.appendChild(b)});
   box.insertBefore(o,fb);
  }else{
   var r=el('<div><input type="text" inputmode="decimal" placeholder="Antwort"></div>'),inp=r.firstChild,bt=document.createElement("button");
   bt.className="chk";bt.textContent="Prüfen";
   bt.onclick=function(){var v=parseFloat(inp.value.replace(",",".").replace("−","-"));res(Math.abs(v-q.a)<1e-6)};
   inp.onkeydown=function(e){if(e.key=="Enter")bt.onclick()};
   r.appendChild(bt);box.insertBefore(r,fb);
  }
  c.appendChild(box);
 });
}
function show(i){
 cur=i;var tp=T[i],v=document.getElementById("view");v.innerHTML="";
 [].forEach.call(document.querySelectorAll("nav button"),function(b,j){b.className=j==i?"on":""});
 var c=el('<div class="card"><h2></h2><p></p><a class="vid" target="_blank" rel="noopener">▶ Lehrer Schmidt: Videos zum Thema</a></div>');
 c.querySelector("h2").textContent=tp.n;c.querySelector("p").textContent=tp.txt;
 c.querySelector("a").href="https://www.youtube.com/results?search_query="+encodeURIComponent(tp.vid);
 c.querySelector("a").textContent="▶ Mehr Lehrer-Schmidt-Videos suchen";
 (tp.v||[]).forEach(function(x){var s=el('<div><a class="vc" target="_blank" rel="noopener"><span class="pl">▶</span><span class="vt"></span></a></div>');s.querySelector(".vt").textContent=x[0];s.querySelector(".vc").href="https://www.youtube.com/watch?v="+x[1];c.insertBefore(s,c.querySelector(".vid"))});
 v.appendChild(c);
 if(tp.plot)plot(v,tp.plot);
 var qc=el('<div class="card"><h2>Aufgaben</h2></div>');quiz(qc,tp);v.appendChild(qc);
}
var nav=document.getElementById("nav");
T.forEach(function(t,i){var b=document.createElement("button");b.textContent=t.n;b.onclick=function(){show(i)};nav.appendChild(b)});
function test(){
 var v=document.getElementById("view");v.innerHTML="";
 [].forEach.call(document.querySelectorAll("nav button"),function(b,j){b.className=j==T.length?"on":""});
 var rnd=function(){return Math.random()-.5},items=[];
 T.forEach(function(tp){tp.q.slice().sort(rnd).slice(0,3).forEach(function(q){items.push({q:q,n:tp.n})})});
 items.sort(rnd);
 var c=el('<div class="card"><h2>Test: alle Themen</h2><p>12 gemischte Aufgaben. Die Auswertung kommt am Ende.</p></div>'),ch=[],inp=[];
 items.forEach(function(it,i){
  var q=it.q,box=el('<div class="q"><p></p></div>');
  box.querySelector("p").textContent=(i+1)+". "+q.t;
  if(q.o){var o=el('<div class="opts"></div>'),bs=[];
   q.o.forEach(function(t,j){var b=document.createElement("button");b.textContent=t;b.onclick=function(){ch[i]=j;bs.forEach(function(x){x.className=""});b.className="sel"};bs.push(b);o.appendChild(b)});
   box.appendChild(o);
  }else{var t=document.createElement("input");t.type="text";t.setAttribute("inputmode","decimal");t.placeholder="Antwort";inp[i]=t;box.appendChild(t)}
  c.appendChild(box);
 });
 var go=document.createElement("button");go.className="chk";go.textContent="Auswerten";
 var out=el('<div class="res"></div>');
 go.onclick=function(){
  var n=0,bad={};
  items.forEach(function(it,i){var q=it.q,ok=q.o?ch[i]===q.a:(inp[i]&&Math.abs(parseFloat(inp[i].value.replace(",",".").replace("−","-"))-q.a)<1e-6);if(ok)n++;else bad[it.n]=1});
  var p=n/items.length*100,note=p>=92?1:p>=81?2:p>=67?3:p>=50?4:p>=30?5:6,w=Object.keys(bad);
  out.textContent=n+" von "+items.length+" richtig (Note "+note+")."+(w.length?" Wiederhole: "+w.join(", ")+".":" Stark, alles richtig!");
  var nb=document.createElement("button");nb.className="chk";nb.textContent="Neuer Test";nb.onclick=test;out.appendChild(document.createElement("br"));out.appendChild(nb);
 };
 c.appendChild(go);c.appendChild(out);v.appendChild(c);window.scrollTo(0,0);
}
var tb=document.createElement("button");tb.textContent="Test (alle Themen)";tb.onclick=test;nav.appendChild(tb);
score();show(0);
</script>
</body>
</html>
